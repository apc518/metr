<!DOCTYPE html>
<html lang="en">
<head>
	<title>MeTr - ChamberCode</title>
	<link rel="stylesheet" type="text/css" href="index.css">
	<meta charset="utf-8"/>
	<script src="lib/p5.min.js"></script>
	<script src="lib/sweetalert2.min.js"></script>
</head>
<body>
<div id="main">
	<div style="display: flex">
		<div style="flex: 1">
			<h1>MeTr</h1>
			<h3>Metric Trees</h3>
		</div>
		<div style="flex: 2; margin: auto;">
			<input type="text" id="mtsInput" class="meterTextInput"/>
			<p id="mtsError" class="errorMessage"></p>
		</div>
		<div style="flex: 1">
			<p id="timeSigDisplay">?</p>
		</div>
	</div>
	<div style="display: flex;">
		<div id="patchSettings">
			<div class="settingsCategory">
				<label for="presetSelectDropdown" id="presetSelectDropdownLabel" class="settingsCategoryLabel">Presets</label>
				<br/>
				<select id="presetSelectDropdown" class="patchDropdown"></select>
			</div>
			<div class="appDrawerDivider"></div>
			<br/>
			<div class="settingsCategory">
				<label for="tempoInput" id="tempoInputLabel" class="settingsCategoryLabel">Tempo</label>
				<br/>
				<input type="number" id="tempoInput" class="patchBigNumber" />
				<select id="displayTempoDropdown"  class="patchDropdown"></select>
			</div>
			<div class="settingsCategory">
				<div class="patchSettingRow">
					<input type="checkbox" id="accentDownbeatCheckbox" /> <label for="accentDownbeatCheckbox" class="settingsCategoryLabel">Accent Downbeat</label>
				</div>
				<div class="patchSettingRow">
					<input type="checkbox" id="pitchesHighToLowCheckbox" /> <label for="pitchesHighToLowCheckbox" class="settingsCategoryLabel">High to Low Pitches</label>
				</div>
				<div class="patchSettingRow">
					<input type="number" id="pitchSpreadInput" class="patchSmallNumber" step="0.1" /> <label for="pitchSpreadInput" class="settingsCategoryLabel">Pitch Ratio</label>
				</div>
				<div class="patchSettingRow">
					<input type="number" id="volumeFalloffInput" class="patchSmallNumber" step="0.1" /> <label for="volumeFalloffInput" class="settingsCategoryLabel">Volume Falloff</label>
				</div>
				<div class="patchSettingRow">
					<input type="number" id="numLayersMutedInput" class="patchSmallNumber" step="1" min="0" /> <label for="numLayersMutedInput" class="settingsCategoryLabel">Muted Layers</label>
				</div>
			</div>
			<div id="audioSampleSettings" class="settingsCategory">
				<label for="audioSampleDropdown" class="settingsCategoryLabel">Audio Sample</label>
				<br/>
				<select id="audioSampleDropdown"  class="patchDropdown"></select>
			</div>
			<div class="appDrawerDivider"></div>
			<br/>
			<div class="settingsCategory">
				<label id="nodeNumberModeDropdownLabel" class="settingsCategoryLabel">Node Numbers</label>
				<div id="nodeNumberModeSelectorContainer">
					<div class="nodeNumberModeOption" id="nodeNumberModeLeaves" style="flex: 1;">
						Leaves
					</div>
					<div class="nodeNumberModeOption" id="nodeNumberModeChildren" style="flex: 1;">
						Children
					</div>
				</div>
			</div>
			<div class="settingsCategory">
				<details style="text-align: left; line-height: 1rem; user-select: none;" open>
					<summary>Highlight Hue</summary>
					<div id="hueInput">
						<div id="hueInputCursor"></div>
					</div>
				</details>
			</div>
		</div>
		<div>
			<div id="p5canvas"></div>
			<div id="bottomControlBar">
				<div class="playback-control-bar">
					<button id="playPauseBtn" class="playbar-button"><img id="playPauseBtnIcon" src="assets/images/play.png" class="playbar-button-icon"/></button>
					<button id="resetBtn" class="playbar-button"><img src="assets/images/stop.png" class="playbar-button-icon"/></button>
					<div id="volumeSliderContainer">
						<img id="volumeIcon" src="assets/images/volume_high_white.png">
						<input type="range" min="0" max="100" id="globalVolumeSlider" class="slider"/>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<script src="MetricTree.js" defer></script>
<script src="sound.js" defer></script>
<script src="metricTreeShorthand.js" defer></script>
<script src="environment.js" defer></script>
<script src="meters.js" defer></script>
<script src="index.js" defer></script>
<script src="patch.js" defer></script>
<script src="htmlHandlers.js" defer></script>
<script src="tests.js" defer></script>
</body>
</html>
